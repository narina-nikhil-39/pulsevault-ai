# =============================================================================
# SynapseHealth (PulseVault AI) — Production Multi-Container Compose Stack
# Bundles FastAPI Gateway, React SPA (Nginx), PostgreSQL 16 (WAL), Neo4j 5, and Qdrant
# =============================================================================

version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Primary Relational Store: PostgreSQL 16 with WAL mode
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: synapsehealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synapsehealth
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse_secret_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres
      -c wal_level=replica
      -c synchronous_commit=on
      -c max_connections=100
      -c shared_buffers=256MB
      -c work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapsehealth"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - synapse-net

  # ---------------------------------------------------------------------------
  # 2. Clinical Property Graph Database: Neo4j Community 5.23
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.23-community
    container_name: synapsehealth-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-synapsehealth}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 256M
      NEO4J_dbms_memory_heap_initial__size: 256M
      NEO4J_dbms_memory_heap_max__size: 512M
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"   # Neo4j Browser Web UI
      - "7687:7687"   # Bolt Driver Protocol
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - synapse-net

  # ---------------------------------------------------------------------------
  # 3. Vector Database for Semantic Clinical Search: Qdrant
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: synapsehealth-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synapse-net

  # ---------------------------------------------------------------------------
  # 4. Backend Gateway: FastAPI Multi-Stage Container
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synapsehealth-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://synapse:${POSTGRES_PASSWORD:-synapse_secret_2026}@postgres:5432/synapsehealth
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-synapsehealth}
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENFDA_BASE_URL: ${OPENFDA_BASE_URL:-https://api.fda.gov}
      RXNAV_BASE_URL: ${RXNAV_BASE_URL:-https://rxnav.nlm.nih.gov/REST}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-synapsehealth-prod-secret-2026}
      UPLOAD_DIR: /app/data/uploads
      PORT: 8000
      HOST: 0.0.0.0
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - api_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - synapse-net

  # ---------------------------------------------------------------------------
  # 5. Frontend Console: Vite + React 19 SPA (Nginx Alpine)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synapsehealth-web
    restart: unless-stopped
    ports:
      - "3000:80"     # Access app at http://localhost:3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - synapse-net

# =============================================================================
# Persistent Storage Volumes & Network Bridge
# =============================================================================
volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  qdrant_data:
    driver: local
  api_data:
    driver: local

networks:
  synapse-net:
    driver: bridge
